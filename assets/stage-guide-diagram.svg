  <title id="title">모아타운과 세부구역의 주요 단계</title>
  <desc id="desc">모아타운 전체는 대상지 선정과 관리계획 승인, 개별 모아주택은 조합설립인가와 사업시행계획인가, 착공을 거칩니다. 구역별 일정은 다릅니다.</desc>
